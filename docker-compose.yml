version: '3.8'

services:
  # Base de données MySQL
  db:
    image: mysql:8
    container_name: smarttask-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smarttask
      MYSQL_USER: smartuser
      MYSQL_PASSWORD: smartpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - smarttask-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    container_name: smarttask-backend
    environment:
      PORT: 5000
      DB_HOST: db
      DB_USER: smartuser
      DB_PASS: smartpass
      DB_NAME: smarttask
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smarttask-network
    restart: unless-stopped

  # Frontend React
  frontend:
    build: ./frontend
    container_name: smarttask-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smarttask-network
    restart: unless-stopped

# Volumes persistants
volumes:
  db_data:

# Réseau dédié
networks:
  smarttask-network:
    driver: bridge
